# ===================================================================
# Módulo: atendimento
# ===================================================================

server.port=8083
spring.application.name=atendimento

# ===================================================================
# Banco de dados — MySQL
# DB_HOST cai pra localhost fora do Docker, db-atendimento dentro
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3309}/clinica_atendimento?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# show-sql desligado por padrao — em dev, habilite via SPRING_JPA_SHOW_SQL=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
# formatacao do SQL acompanha o show-sql — so faz efeito quando o SQL e impresso
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_SHOW_SQL:false}
# fecha a sessao apos o controller; serializacao do response NAO consegue mais
# resolver associacoes LAZY — usar @EntityGraph quando precisar
spring.jpa.open-in-view=false

# ===================================================================
# Comunicacao com agendamento — usa hostname Docker em producao
# ===================================================================
agendamento.url=${AGENDAMENTO_URL:http://localhost:8082}

# ===================================================================
# Outbox — entrega assincrona com retry da notificacao ao agendamento
# max-retry: tentativas antes de o evento parar de ser reprocessado
# poll-interval-ms: intervalo do scheduler que drena o outbox
# ===================================================================
outbox.max-retry=${OUTBOX_MAX_RETRY:3}
outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:10000}
# batch-size: limite de eventos por poll — a entrega (Feign) ocorre dentro da tx que
# segura o lock pessimista; limitar evita prender lock+conexao durante I/O de batch grande
outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
# housekeeping: purga eventos terminais (PROCESSADO/DESCARTADO) mais antigos que retention-days
outbox.retention-days=${OUTBOX_RETENTION_DAYS:7}
outbox.purge-interval-ms=${OUTBOX_PURGE_INTERVAL_MS:86400000}

# ===================================================================
# OpenFeign — OkHttp como cliente HTTP (suporta PATCH; substitui RestTemplate)
# ===================================================================
spring.cloud.openfeign.okhttp.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# ===================================================================
# Actuator — expoe health e info para Docker/k8s healthcheck
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# ===================================================================
# Logging — nivel da aplicacao ajustavel por env (LOG_LEVEL_APP=DEBUG em dev)
# Formato e correlation-id configurados em logback-base.xml (commons)
# ===================================================================
logging.level.br.edu.imepac=${LOG_LEVEL_APP:INFO}

# ===================================================================
# Keycloak — Resource Server (validacao JWT)
# ===================================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/clinica/protocol/openid-connect/certs}
app.security.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/clinica}
app.security.jwt.audience=${KEYCLOAK_AUDIENCE:clinica-api}

# ===================================================================
# Keycloak — Service Client (Feign client credentials)
# ===================================================================
keycloak.service.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8180/realms/clinica/protocol/openid-connect/token}
keycloak.service.client-id=clinica-service
# Sem default: a aplicacao falha no startup se KEYCLOAK_SERVICE_SECRET nao estiver definido
keycloak.service.client-secret=${KEYCLOAK_SERVICE_SECRET}
