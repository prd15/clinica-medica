server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: administrativo
          uri: ${ADMINISTRATIVO_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=2

        - id: agendamento
          uri: ${AGENDAMENTO_URL:http://localhost:8082}
          predicates:
            - Path=/api/agendamentos/**
          filters:
            - StripPrefix=2

        - id: atendimento
          uri: ${ATENDIMENTO_URL:http://localhost:8083}
          predicates:
            - Path=/api/atendimentos/**
          filters:
            - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info
