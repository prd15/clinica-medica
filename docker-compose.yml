# Compose principal da clinica — cada microsservico tem seu proprio banco
# pra manter o isolamento que a arquitetura pede
name: brahma-clinic

services:
  # Uso 3307 aqui pra nao conflitar com o MySQL que ja tenho rodando local
  db-administrativo:
    image: mysql:8
    container_name: db-administrativo
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_administrativo
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "3307:3306"
    volumes:
      - vol-administrativo:/var/lib/mysql
    # Sem esse healthcheck o Java tenta conectar antes do banco estar pronto
    # e quebra na inicializacao — aprendi isso da pior forma
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinica-network

  # 3308 pro agendamento — cada banco numa porta diferente facilita debug
  db-agendamento:
    image: mysql:8
    container_name: db-agendamento
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_agendamento
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "3308:3306"
    volumes:
      - vol-agendamento:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinica-network

  # 3309 fecha os 3 bancos — agora cada microsservico tem o seu
  db-atendimento:
    image: mysql:8
    container_name: db-atendimento
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_atendimento
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "3309:3306"
    volumes:
      - vol-atendimento:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinica-network

  administrativo:
    build:
      # Contexto na raiz porque o Dockerfile precisa enxergar commons/ e administrativo/
      context: .
      dockerfile: administrativo/Dockerfile
    container_name: administrativo
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db-administrativo
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # Hostname interno do Docker — administrativo chama agendamento para o relatorio de consultas-diarias
      AGENDAMENTO_URL: http://agendamento:8082
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/clinica/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: http://keycloak:8180/realms/clinica/protocol/openid-connect/token
      KEYCLOAK_SERVICE_SECRET: ${KEYCLOAK_SERVICE_SECRET:?KEYCLOAK_SERVICE_SECRET obrigatorio no .env}
    depends_on:
      db-administrativo:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - clinica-network

  agendamento:
    build:
      context: .
      dockerfile: agendamento/Dockerfile
    container_name: agendamento
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      DB_HOST: db-agendamento
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # Hostname interno do Docker — agendamento chama administrativo pelo nome do container
      ADMINISTRATIVO_URL: http://administrativo:8081
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/clinica/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: http://keycloak:8180/realms/clinica/protocol/openid-connect/token
      KEYCLOAK_SERVICE_SECRET: ${KEYCLOAK_SERVICE_SECRET:?KEYCLOAK_SERVICE_SECRET obrigatorio no .env}
    depends_on:
      db-agendamento:
        condition: service_healthy
      administrativo:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - clinica-network

  atendimento:
    build:
      context: .
      dockerfile: atendimento/Dockerfile
    container_name: atendimento
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      DB_HOST: db-atendimento
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # Atendimento depende do agendamento pra consultar dados de agenda
      AGENDAMENTO_URL: http://agendamento:8082
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/clinica/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: http://keycloak:8180/realms/clinica/protocol/openid-connect/token
      KEYCLOAK_SERVICE_SECRET: ${KEYCLOAK_SERVICE_SECRET:?KEYCLOAK_SERVICE_SECRET obrigatorio no .env}
    depends_on:
      db-atendimento:
        condition: service_healthy
      agendamento:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - clinica-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_PORT: 8180
      KC_HTTP_ENABLED: "true"
      # Substituido no realm-clinica.json no import (placeholder ${KEYCLOAK_SERVICE_SECRET})
      KEYCLOAK_SERVICE_SECRET: ${KEYCLOAK_SERVICE_SECRET:?KEYCLOAK_SERVICE_SECRET obrigatorio no .env}
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    networks:
      - clinica-network
    # A imagem keycloak:24 (UBI9) nao tem curl nem wget.
    # bash /dev/tcp verifica se a porta esta aceitando conexoes — funciona no UBI9.
    # start_period generoso porque o Keycloak 24 em start-dev demora ~30s para subir.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8180 2>/dev/null'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      ADMINISTRATIVO_URL: http://administrativo:8081
      AGENDAMENTO_URL: http://agendamento:8082
      ATENDIMENTO_URL: http://atendimento:8083
      KEYCLOAK_JWK_URI: http://keycloak:8180/realms/clinica/protocol/openid-connect/certs
    depends_on:
      administrativo:
        condition: service_started
      agendamento:
        condition: service_started
      atendimento:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - clinica-network

volumes:
  vol-administrativo:
  vol-agendamento:
  vol-atendimento:

# Rede interna compartilhada entre todos os containers
# Sem ela o agendamento nao consegue falar com o administrativo pelo hostname
networks:
  clinica-network:
    driver: bridge
