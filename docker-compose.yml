# Compose principal da clinica — cada microsservico tem seu proprio banco
# pra manter o isolamento que a arquitetura pede
version: "3.9"

services:
  # Uso 3307 aqui pra nao conflitar com o MySQL que ja tenho rodando local
  db-administrativo:
    image: mysql:8
    container_name: db-administrativo
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_administrativo
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "3307:3306"
    volumes:
      - vol-administrativo:/var/lib/mysql
    networks:
      - clinica-network

  # 3308 pro agendamento — cada banco numa porta diferente facilita debug
  db-agendamento:
    image: mysql:8
    container_name: db-agendamento
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_agendamento
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "3308:3306"
    volumes:
      - vol-agendamento:/var/lib/mysql
    networks:
      - clinica-network

  # 3309 fecha os 3 bancos — agora cada microsservico tem o seu
  db-atendimento:
    image: mysql:8
    container_name: db-atendimento
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinica_atendimento
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "3309:3306"
    volumes:
      - vol-atendimento:/var/lib/mysql
    networks:
      - clinica-network

volumes:
  vol-administrativo:
  vol-agendamento:
  vol-atendimento:

# Rede interna compartilhada entre todos os containers
# Sem ela o agendamento nao consegue falar com o administrativo pelo hostname
networks:
  clinica-network:
    driver: bridge
