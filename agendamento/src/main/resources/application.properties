# ===================================================================
# Módulo: agendamento
# ===================================================================

server.port=8082
spring.application.name=agendamento

# ===================================================================
# Banco de dados — MySQL
# DB_HOST cai pra localhost fora do Docker, db-agendamento dentro
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/clinica_agendamento?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# show-sql desligado por padrao — em dev, habilite via SPRING_JPA_SHOW_SQL=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
# formatacao do SQL acompanha o show-sql — so faz efeito quando o SQL e impresso
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_SHOW_SQL:false}

# ===================================================================
# Comunicacao com administrativo — usa hostname Docker em producao
# ===================================================================
administrativo.url=${ADMINISTRATIVO_URL:http://localhost:8081}
