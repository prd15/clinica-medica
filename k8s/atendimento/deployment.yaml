apiVersion: apps/v1
kind: Deployment
metadata:
  name: atendimento
  namespace: clinica
  labels:
    app: atendimento
spec:
  replicas: 1
  # Recreate: evita duas instancias simultaneas rodando ddl-auto=update
  # no mesmo banco durante o rollout (e poupa memoria em cluster local)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atendimento
  template:
    metadata:
      labels:
        app: atendimento
    spec:
      restartPolicy: Always
      containers:
        - name: atendimento
          image: clinica/atendimento:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: atendimento-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: atendimento-config
                  key: DB_USER
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: atendimento-config
                  key: DB_PORT
            - name: AGENDAMENTO_URL
              valueFrom:
                configMapKeyRef:
                  name: atendimento-config
                  key: AGENDAMENTO_URL
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: clinica-secrets
                  key: db-password
            - name: KEYCLOAK_JWK_URI
              valueFrom:
                configMapKeyRef:
                  name: atendimento-config
                  key: KEYCLOAK_JWK_URI
            - name: KEYCLOAK_TOKEN_URL
              valueFrom:
                configMapKeyRef:
                  name: atendimento-config
                  key: KEYCLOAK_TOKEN_URL
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: atendimento-config
                  key: KEYCLOAK_ISSUER_URI
            # Sem default no application.properties — o pod nem sobe sem esse secret
            - name: KEYCLOAK_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: clinica-secrets
                  key: keycloak-service-secret
          # Spring Boot leva ~30-60s pra subir; sem startupProbe o liveness
          # mata o pod antes do fim do boot
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 5
            # ate 5min de boot — em maquinas locais com pouca CPU o Spring demora
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
