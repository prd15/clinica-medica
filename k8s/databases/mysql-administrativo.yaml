apiVersion: v1
kind: ConfigMap
metadata:
  name: db-administrativo-config
  namespace: clinica
data:
  MYSQL_DATABASE: clinica_administrativo
---
apiVersion: v1
kind: Service
metadata:
  name: db-administrativo
  namespace: clinica
  labels:
    app: db-administrativo
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: db-administrativo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-administrativo
  namespace: clinica
  labels:
    app: db-administrativo
spec:
  serviceName: db-administrativo
  replicas: 1
  selector:
    matchLabels:
      app: db-administrativo
  template:
    metadata:
      labels:
        app: db-administrativo
    spec:
      containers:
        - name: mysql
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinica-secrets
                  key: db-password
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: db-administrativo-config
                  key: MYSQL_DATABASE
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          # Mesmo healthcheck do docker-compose — sem ele o Java tenta conectar
          # antes do banco aceitar conexoes
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
