apiVersion: v1
kind: ConfigMap
metadata:
  name: db-agendamento-config
  namespace: clinica
data:
  MYSQL_DATABASE: clinica_agendamento
---
apiVersion: v1
kind: Service
metadata:
  name: db-agendamento
  namespace: clinica
  labels:
    app: db-agendamento
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: db-agendamento
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-agendamento
  namespace: clinica
  labels:
    app: db-agendamento
spec:
  serviceName: db-agendamento
  replicas: 1
  selector:
    matchLabels:
      app: db-agendamento
  template:
    metadata:
      labels:
        app: db-agendamento
    spec:
      containers:
        - name: mysql
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clinica-secrets
                  key: db-password
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: db-agendamento-config
                  key: MYSQL_DATABASE
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
