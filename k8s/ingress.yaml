apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinica-ingress
  namespace: clinica
spec:
  ingressClassName: nginx
  rules:
    # Todo o trafego de API entra pelo gateway (rotas /api/admin, /api/agendamentos,
    # /api/atendimentos) — os servicos nao sao mais expostos diretamente
    - host: clinica.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
    # Keycloak exposto para obtencao de tokens de fora do cluster
    - host: keycloak.clinica.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8180
